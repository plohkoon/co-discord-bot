# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# Deploys only after CI has gone green on main. Previously this triggered on
# `push` alongside CI, so the two raced and a merge with failing tests shipped
# anyway. workflow_run is the only way to depend on another workflow — `needs:`
# can't cross workflow files.

name: Fly Deploy
permissions:
  contents: read
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    # The branch of the CI run that finished, not of this workflow.
    branches: [ main ]

jobs:
  deploy:
    name: Deploy app
    # workflow_run fires for failed runs too, so the conclusion has to be
    # checked explicitly. The event check keeps a green *pull_request* run from
    # ever reaching here: this job has the deploy token, and PR code must not
    # be able to trigger it.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-group
      cancel-in-progress: false # let a running deploy finish; deploys are cumulative
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy the exact commit CI validated. Without this, checkout takes
          # the tip of the default branch, which may already have moved on to a
          # commit nothing has tested.
          ref: ${{ github.event.workflow_run.head_sha }}
      # Deploys queue in deploy-group, so when two merges land close together
      # the older commit's deploy can run *second* and roll back the newer one
      # (happened with #54/#56: v63 shipped the commit without #54). Only the
      # commit still at main's tip deploys; a superseded one skips, because the
      # newer commit's own CI run will deploy it — and if that CI fails, the
      # newer commit is what's broken, so shipping the older one is no fix.
      - name: Skip if main has moved on
        id: freshness
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy of $HEAD_SHA — main is now at $tip, whose CI run deploys it."
          fi
      - if: steps.freshness.outputs.current == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: steps.freshness.outputs.current == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
