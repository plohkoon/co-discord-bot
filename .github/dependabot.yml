version: 2
# Supply-chain hardening: `cooldown` makes Dependabot ignore any release for
# `default-days` after it is published, so we never adopt a version until it has
# been public for over a week. This sidesteps the recent wave of malicious
# releases that are typically caught and yanked within a few days of publish.
# Dependabot is the enforcement point — Bundler has no native minimum-release-age
# setting, and all updates flow through here.
#
# Minor + patch updates land as one grouped weekly PR; majors get individual PRs
# (anything not captured by a group falls out separately by default).
#
# Bundler covers every gem in the lockfile, not just the Gemfile's direct ones
# (`dependency-type: all`): most of what the CI gem scan flags — rack,
# nokogiri, loofah, rails-html-sanitizer — arrives transitively, and
# Dependabot's default would never bump it. Security updates (separate repo
# setting) already cover transitives but only once an advisory reaches
# GitHub's database, which lags the ruby-advisory-db that bundler-audit reads.
#
# There is no npm entry: JS goes through importmap (no package.json), which
# Dependabot doesn't support — `bin/importmap audit` in CI covers those pins.
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    allow:
      - dependency-type: all
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
